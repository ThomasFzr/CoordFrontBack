# Journal sans position : $uri est le chemin SANS la chaîne de requête (?lat=…&lon=…).
# Jamais $request, $request_uri ni $args (GeolocPrivacyTest le vérifie).
log_format sans_position '$remote_addr [$time_local] '
                         '"$request_method $uri" $status $body_bytes_sent';
server {
 listen 80;
 root /usr/share/nginx/html;
 # Remplace, pour ce serveur, le format « main » de l'image (qui contient $request, donc la requête complète).
 access_log /var/log/nginx/access.log sans_position;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ {
  access_log /var/log/nginx/access.log sans_position;  # pas de $args
  # Les erreurs amont (« upstream timed out… request: "GET /api/…?lat=…" ») recopient la requête complète :
  # on ne garde que le niveau crit ici. Le 502/504 reste visible dans le journal d'accès, sans position.
  error_log /var/log/nginx/error.log crit;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
}
