server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: false
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medislot}
    username: ${DB_USER:medislot}
    password: ${DB_PASSWORD:medislot-local-only}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
medislot:
  demo-seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  export:
    aws-access-key-id: ${EXPORT_AWS_ACCESS_KEY_ID:}
