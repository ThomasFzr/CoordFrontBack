    "/events": {
      "get": {
        "summary": "Flux SSE public",
        "description": "Événements ready, slots-changed, heartbeat. La reconnexion déclenche ready et une relecture de l’état. Pas de rejeu durable.",
        "responses": {
          "200": {
            "description": "Flux texte continu",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/notifications/events": {
      "get": {
        "summary": "Flux SSE privé",
        "description": "Événements ready, notifications-changed, heartbeat. La reconnexion déclenche ready et une relecture de l’état. Pas de rejeu durable.",
        "responses": {
          "200": {
            "description": "Flux texte continu",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "description": "Session requise",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    }
  },
  "components": {
    "schemas": {
      "Professional": {
        "type": "object",
        "required": [
          "id",
          "name",
          "specialty",
          "city",
          "address",
          "bio",
          "fee"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "bio": {
            "type": "string"
          },
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "fee": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Slot": {
        "type": "object",
        "required": [
          "id",
          "professionalId",
          "startsAt",
          "endsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "BookingRequest": {
        "type": "object",
        "required": [
          "slotId"
        ],
        "properties": {
          "slotId": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Appointment": {
        "type": "object",
        "required": [
          "id",
          "slotId",
          "professionalId",
          "professionalName",
          "status",
          "startsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "slotId": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "professionalName": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "CONFIRMED",
              "CANCELLED"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Identity": {
        "type": "object",
        "required": [
          "id",
          "name",
          "email",
          "role"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string"
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        }
      },
      "Notification": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "message": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "History": {
        "type": "object",
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "CREATED",
              "RESCHEDULED",
              "CANCELLED"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    },
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
