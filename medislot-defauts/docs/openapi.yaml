                  },
                  "name": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 120
                  },
                  "password": {
                    "type": "string",
                    "minLength": 12,
                    "maxLength": 72
                  }
                }
              }
            }
          }
        }
      }
