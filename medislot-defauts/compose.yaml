name: medislot-defauts
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: medislot
      POSTGRES_USER: medislot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medislot-local-only}
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medislot"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medislot
      DB_PASSWORD: ${DB_PASSWORD:-medislot-local-only}
      DEMO_SEED: "true"
      # Comptes de démonstration (données fictives) : le mot de passe vient de l'environnement, plus du code Java.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-MediSlot-demo-2026!}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:18081:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["127.0.0.1:8089:80"]
volumes:
  pgdata:
