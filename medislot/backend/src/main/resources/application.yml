server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medislot}
    username: ${DB_USER:medislot}
    password: ${DB_PASSWORD:medislot-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
medislot:
  demo-seed: ${DEMO_SEED:true}
