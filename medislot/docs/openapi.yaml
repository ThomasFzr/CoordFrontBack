          },
          "professionalId": {
            "type": "integer"
          },
          "professionalName": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
