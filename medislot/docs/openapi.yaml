{
  "openapi": "3.1.0",
  "info": {
    "title": "MediSlot",
    "version": "1.0.0",
    "description": "Contrat de la correction pédagogique. Session HttpOnly et CSRF pour les écritures. Données fictives."
  },
  "servers": [
    {
      "url": "http://localhost:8088/api"
    }
  ],
  "paths": {
    "/professionals": {
      "get": {
        "summary": "Rechercher et paginer les professionnels",
        "responses": {
          "200": {
            "description": "Réponse réussie",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "page",
                    "size",
                    "total"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Professional"
                      }
                    },
                    "page": {
                      "type": "integer"
                    },
                    "size": {
                      "type": "integer"
                    },
                    "total": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Données invalides",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "city",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "specialty",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 6
            }
          }
        ]
      }
    },
    "/professionals/{id}": {
      "get": {
        "summary": "Lire la fiche",
        "responses": {
          "200": {
            "description": "Réponse réussie",
