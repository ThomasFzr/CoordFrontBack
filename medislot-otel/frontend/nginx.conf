server {
 listen 80;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 # Spans du navigateur vers le collecteur (cours, chapitre 5). La barre finale de proxy_pass retire le préfixe /otlp :
 # /otlp/v1/traces devient /v1/traces. Même origine que la page : pas de CORS à ouvrir sur le collecteur.
 location /otlp/ {
  proxy_pass http://collector:4318/;
  client_max_body_size 1m;
  limit_except POST { deny all; }
 }
}
