# SonarQube Community Build local (cours SonarQube, partie 2) : http://localhost:9000
# Arrêt sans perte : docker compose -p sonarqube-local stop (jamais down -v : projets et jetons effacés).
name: sonarqube-local
services:
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
