server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS Docker relu toutes les 10 s : l'API peut être recréée (déploiement, rollback) sans 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    # Même origine pour le front et l'API : /api/… est relayé vers l'API sans le préfixe.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # SSE : aucun tampon, sinon les événements restent bloqués dans nginx ;
        # délai de lecture supérieur à l'intervalle du keepalive (15 s).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        # Le front n'a pas de build versionné : le navigateur revalide chaque fichier (304 si inchangé).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
