name: ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: lint
        run: |
          for f in app/src/*.js front/*.js; do node --check "$f"; done

      - name: build
        run: |
          docker build --target prod \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t coordfrontback-api:ci app

      - name: scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --severity CRITICAL --exit-code 1 coordfrontback-api:ci

      - name: test
        run: IMAGE=coordfrontback-api:ci ci/test.sh

      - name: k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-rapport
          path: k6/rapport-ci.html
          if-no-files-found: ignore

      - name: publish
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/coordfrontback-api:${GITHUB_SHA::7}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag coordfrontback-api:ci "$IMAGE"
          docker push "$IMAGE"
          echo "### Image publiée : \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
